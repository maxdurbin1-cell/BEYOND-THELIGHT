name: Reconnect Soak

on:
  pull_request:
    paths:
      - server.js
      - campaign-system.js
      - smoke-tests/**
      - package.json
      - package-lock.json
      - .github/workflows/reconnect-soak.yml
  push:
    branches:
      - main
      - codex-pushfix
    paths:
      - server.js
      - campaign-system.js
      - smoke-tests/**
      - package.json
      - package-lock.json
      - .github/workflows/reconnect-soak.yml
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Reconnect iterations"
        required: false
        default: "40"

jobs:
  reconnect-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      PORT: "3000"
      HOST: "127.0.0.1"
      SMOKE_BASE_URL: "http://127.0.0.1:3000"
      SMOKE_RECONNECT_ITERATIONS: ${{ github.event.inputs.iterations || '40' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start server and run reconnect soak
        shell: bash
        run: |
          set -euo pipefail
          npm start > server.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            if kill -0 "$SERVER_PID" >/dev/null 2>&1; then
              kill "$SERVER_PID" || true
            fi
            echo "--- server log tail ---"
            tail -n 200 server.log || true
          }
          trap cleanup EXIT

          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:3000/api/health" >/dev/null; then
              break
            fi
            if [[ "$i" == "60" ]]; then
              echo "Server did not become healthy in time"
              exit 1
            fi
            sleep 1
          done

          npm run smoke:reconnect
